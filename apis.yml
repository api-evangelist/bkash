aid: bkash
name: bKash
description: bKash is Bangladesh's leading mobile financial services (MFS) provider, offering send money,
  payments, cash-out and a tokenized checkout API for merchants to accept bKash payments. The Payment
  Gateway (PGW) exposes token management, checkout and tokenized checkout, refunds and B2C instant payout
  over a REST/JSON interface. Backed by BRAC Bank and Ant Group.
