aid: bkash
name: bKash
description: >-
  bKash is Bangladesh's largest mobile financial services (MFS) provider, offering
  a Payment Gateway (PGW) that lets online and mobile merchants accept bKash wallet
  payments through secure REST APIs. The developer platform (developer.bka.sh, public
  beta "Inferno Dragon") documents Checkout (hosted iframe/URL), Tokenized Checkout
  (agreement-based PIN-only payments), Instant Payout (B2C disbursement), Add Wallet,
  Auth and Capture, Subscriptions, and real-time webhook Instant Payment Notifications.
  Integration follows a token-based flow — Grant Token, Create Payment, Execute Payment,
  Query, Refund — with a self-service sandbox (service-name.sandbox.bka.sh) and production
  (service-name.pay.bka.sh) environments. bKash is a portfolio company associated with
  the SoftBank Vision Fund and is majority owned by BRAC Bank, with investment from Ant
  Group, the Bill & Melinda Gates Foundation, and IFC.
